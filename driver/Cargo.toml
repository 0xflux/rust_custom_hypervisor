[package]
name = "hypervisor"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]
test = false

[package.metadata.wdk.driver-model]
driver-type = "WDM"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[dependencies]
wdk = "0.5.0"
wdk-alloc = "0.4.2"
wdk-panic = "0.5.0"
wdk-sys = "0.5.2"
shared ={ path = "../shared"}
bitfield = "0.20.0"
anyhow = { version = "1.0", default-features = false }
thiserror = { version = "2.0", default-features = false }


[build-dependencies]
wdk-build = "0.6.0"
